<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
body{font-family:Inter,system-ui,sans-serif;background:#F8FAFC;color:#0f172a}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.03)}
.hov{transition:transform .18s,box-shadow .18s}.hov:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.btn{transition:all .15s}.btn:active{transform:scale(.98)}
:focus-visible{outline:2px solid #6366f1;outline-offset:2px;border-radius:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes toast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes orb{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(139,92,246,.45)}50%{transform:scale(1.06);box-shadow:0 0 0 22px rgba(139,92,246,0)}}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.page{animation:fadeUp .3s ease}.drawer{animation:slideIn .25s ease}.mdrawer{animation:slideL .22s ease}.toast{animation:toast .25s ease}
.orb{animation:orb 2s infinite}.skel{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:10px}
.spin{animation:spin .8s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef,useLayoutEffect}=React;

const INITIAL_COMPLAINTS=[
{id:'CMP-001',category:'Bathroom Leakage',description:'Water leaking near switchboard in Room 204 bathroom. Very dangerous near electrical wiring.',building:'A Block',floor:'2nd Floor',room:'Room 204',area:'East Corridor',image:'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=500&auto=format&fit=crop&q=60',date:'Monday 18:10',status:'Escalated',priority:'CRITICAL',riskScore:98,hazards:['Water near electrical switchboard','Electrical shock risk'],assignedTechnician:'Rajesh Kumar (Electrical)',incidentId:'INC-001',aiExplanation:'AI correlated water leakage with high risk of electrical exposure due to proximity to switchboard.'},
{id:'CMP-002',category:'Lighting',description:'Flickering lights in East Corridor outside room 206 and slight humming noise.',building:'A Block',floor:'2nd Floor',room:'Room 206',area:'East Corridor',image:null,date:'Wednesday 21:40',status:'Escalated',priority:'HIGH',riskScore:82,hazards:['Voltage instability','Potential wiring overload'],assignedTechnician:'Rajesh Kumar (Electrical)',incidentId:'INC-001',aiExplanation:'Geographic proximity to CMP-001 suggests systemic electrical failure in East Corridor wiring.'},
{id:'CMP-003',category:'Electrical Problem',description:'Strong burning plastic smell near East Corridor main sub-panel.',building:'A Block',floor:'2nd Floor',room:'Corridor Main',area:'East Corridor',image:null,date:'Thursday 07:15',status:'Investigating',priority:'CRITICAL',riskScore:99,hazards:['Smoke/Fire risk','Overheating circuit breaker'],assignedTechnician:'Rajesh Kumar (Electrical)',incidentId:'INC-001',aiExplanation:'Critical escalation: Chemical/Plastic odor indicates active thermal damage linked to earlier short circuit hazards.'},
{id:'CMP-004',category:'Furniture',description:'Study table chair leg broken.',building:'B Block',floor:'1st Floor',room:'Room 112',area:'West Wing',image:null,date:'Thursday 10:30',status:'Pending',priority:'LOW',riskScore:15,hazards:['Minor physical strain risk'],assignedTechnician:'Unassigned',incidentId:null,aiExplanation:'Standard maintenance issue with no immediate structural or life safety risk.'},
{id:'CMP-005',category:'Plumbing',description:'Low water pressure in 3rd floor washrooms.',building:'C Block',floor:'3rd Floor',room:'Common Washroom',area:'North Wing',image:null,date:'Thursday 11:15',status:'Assigned',priority:'MEDIUM',riskScore:45,hazards:['Hygiene concerns'],assignedTechnician:'Suresh Patil (Plumber)',incidentId:null,aiExplanation:'Utility inconvenience; requires technician visit within 24 hours.'}];

timeline:[{time:'Monday 18:10',text:'Water near switchboard reported in Room 204',risk:'High (78)',s:78},{time:'Tuesday 09:00',text:'Categorized into routine plumbing queue (Initial Triage)',risk:'Medium (50)',s:50},{time:'Wednesday 21:40',text:'Flickering lights reported in Corridor 206',risk:'High (82)',s:82},{time:'Thursday 07:15',text:'Burning plastic smell reported near sub-panel',risk:'Critical (99)',s:99},{time:'Thursday 07:20',text:'FixieWardie AI Agent correlated 3 complaints into Incident INC-001 & Triggered Warden Alert',risk:'Escalated',s:98}]}];
const INITIAL_TECHNICIANS=[
{id:'TECH-01',name:'Rajesh Kumar',skill:'Electrical Specialist',availability:'Busy',phone:'+91 98765 43210',currentTask:'INC-001 (A Block)',rating:4.9,jobs:3},
{id:'TECH-02',name:'Suresh Patil',skill:'Plumbing & Drainage',availability:'Available',phone:'+91 98765 43211',currentTask:'None',rating:4.7,jobs:1},
{id:'TECH-03',name:'Amit Verma',skill:'General Carpentry',availability:'Available',phone:'+91 98765 43212',currentTask:'None',rating:4.6,jobs:0},
{id:'TECH-04',name:'Ramesh Singh',skill:'HVAC & Refrigeration',availability:'Offline',phone:'+91 98765 43213',currentTask:'None',rating:4.5,jobs:0}];
const AGENTS=[
{n:'Triage Agent',i:'filter',p:'Classifies and routes every incoming complaint.',t:1284,a:'12s ago'},
{n:'Risk Assessment Agent',i:'gauge',p:'Scores hazards from text and photo evidence.',t:1279,a:'12s ago'},
{n:'Incident Correlation Agent',i:'network',p:'Links related complaints by location and time.',t:412,a:'2m ago'},
{n:'Action Planner Agent',i:'list-checks',p:'Generates response plans and picks technicians.',t:398,a:'2m ago'},
{n:'Notification Agent',i:'bell-ring',p:'Alerts wardens, technicians and students.',t:1560,a:'5s ago'}];

/* ============ HELPERS ============ */
const RISK={CRITICAL:['bg-red-50 text-red-700 ring-red-200','bg-red-500'],HIGH:['bg-amber-50 text-amber-700 ring-amber-200','bg-amber-500'],MEDIUM:['bg-yellow-50 text-yellow-700 ring-yellow-200','bg-yellow-500'],LOW:['bg-emerald-50 text-emerald-700 ring-emerald-200','bg-emerald-500']};
const STAT={Escalated:'bg-red-50 text-red-700 ring-red-200',Investigating:'bg-amber-50 text-amber-700 ring-amber-200',Pending:'bg-slate-100 text-slate-600 ring-slate-200',Assigned:'bg-indigo-50 text-indigo-700 ring-indigo-200',Resolved:'bg-emerald-50 text-emerald-700 ring-emerald-200'};
const conf=c=>Math.min(99,70+Math.round(c.riskScore/4));
const cls=(...a)=>a.filter(Boolean).join(' ');
function Icon({n,c='w-4 h-4'}){const r=useRef();useLayoutEffect(()=>{if(r.current&&window.lucide){r.current.innerHTML=`<i data-lucide="${n}"></i>`;window.lucide.createIcons();}},[n]);return <span ref={r} className={cls('inline-flex shrink-0',c)} aria-hidden="true" style={{lineHeight:0}} />;}
const Risk=({p,s})=>{const[a,b]=RISK[p]||RISK.LOW;return <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 text-[11px] font-semibold rounded-full ring-1 ${a}`}><span className={`w-1.5 h-1.5 rounded-full ${b} ${p==='CRITICAL'?'animate-pulse':''}`}/>{p}{s!==undefined&&<span className="opacity-70">· {s}</span>}</span>;};
const Pill=({s})=><span className={`inline-flex px-2 py-0.5 text-[11px] font-semibold rounded-full ring-1 ${STAT[s]||STAT.Pending}`}>{s}</span>;
const AIBadge=({children='AI-generated'})=><span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-ai-50 text-ai-700 ring-1 ring-ai-100"><Icon n="sparkles" c="w-3 h-3"/>{children}</span>;
const Tip=({t,children})=><span className="relative group inline-flex">{children}<span role="tooltip" className="pointer-events-none absolute -bottom-8 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-md bg-slate-900 text-white text-[11px] px-2 py-1 opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition z-50">{t}</span></span>;
function Gauge({v,size=140}){const col=v>85?'#ef4444':v>60?'#f59e0b':'#10b981',r=52,C=2*Math.PI*r,[o,setO]=useState(0);useEffect(()=>{const t=setTimeout(()=>setO(v),80);return()=>clearTimeout(t)},[v]);
return <div className="relative" style={{width:size,height:size}}><svg viewBox="0 0 120 120" className="-rotate-90"><circle cx="60" cy="60" r={r} fill="none" stroke="#f1f5f9" strokeWidth="10"/><circle cx="60" cy="60" r={r} fill="none" stroke={col} strokeWidth="10" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*(1-o/100)} style={{transition:'stroke-dashoffset 1s ease'}}/></svg><div className="absolute inset-0 grid place-items-center text-center"><div><div className="text-3xl font-extrabold">{v}</div><div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Risk score</div></div></div></div>;}
function Timeline({items}){return <ol className="relative ml-3 border-l-2 border-slate-200 space-y-5">{items.map((it,i)=><li key={i} className="ml-5 relative"><span className={cls('absolute -left-[31px] top-0.5 w-6 h-6 rounded-full grid place-items-center ring-4 ring-white text-white',it.done===false?'bg-slate-300':it.color||'bg-indigo-600')}><Icon n={it.icon||'check'} c="w-3 h-3"/></span><div className="flex flex-wrap items-center gap-2"><p className="text-sm font-semibold">{it.title}</p>{it.time&&<span className="text-[11px] text-slate-400">{it.time}</span>}{it.tag&&<span className="text-[11px] font-semibold text-slate-500">{it.tag}</span>}</div>{it.text&&<p className="text-sm text-slate-500 mt-0.5">{it.text}</p>}</li>)}</ol>;}
const Empty=({icon,title,text,action})=><div className="text-center py-14 px-6"><div className="mx-auto w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 grid place-items-center mb-3"><Icon n={icon} c="w-5 h-5"/></div><p className="font-semibold">{title}</p><p className="text-sm text-slate-500 mt-1">{text}</p>{action}</div>;
const Btn=({v='primary',className='',...p})=><button {...p} className={cls('btn inline-flex items-center justify-center gap-2 rounded-xl text-sm font-semibold px-4 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed',v==='primary'&&'bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm',v==='ghost'&&'bg-white border border-slate-200 hover:bg-slate-50 text-slate-700',v==='danger'&&'bg-red-600 hover:bg-red-700 text-white shadow-sm',v==='ai'&&'bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white shadow-md',className)}/>;
const inp='w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-400';
const Head=({title,sub,right})=><div className="flex flex-wrap items-end justify-between gap-3 mb-6"><div><h1 className="text-2xl font-bold tracking-tight">{title}</h1>{sub&&<p className="text-sm text-slate-500 mt-1">{sub}</p>}</div>{right}</div>;

function Confirm({d,onClose}){if(!d)return null;return <div className="fixed inset-0 z-[70] bg-slate-900/40 grid place-items-center p-4" role="dialog" aria-modal="true" onClick={onClose}><div className="card p-6 max-w-sm w-full toast" onClick={e=>e.stopPropagation()}><h3 className="font-bold text-lg">{d.title}</h3><p className="text-sm text-slate-500 mt-1.5">{d.text}</p><div className="flex justify-end gap-2 mt-5"><Btn v="ghost" onClick={onClose}>Cancel</Btn><Btn v={d.danger?'danger':'primary'} onClick={()=>{d.ok();onClose()}}>{d.cta||'Confirm'}</Btn></div></div></div>;}

/* ============ ASSIGN MODAL (original behaviour kept) ============ */
function AssignModal({complaint,technicians,onClose,onAssign}){const[sel,setSel]=useState('');if(!complaint)return null;
const pick=t=>`${t.name} (${t.skill.split(' ')[0]})`;
return <div className="fixed inset-0 z-[65] bg-slate-900/40 grid place-items-center p-4" role="dialog" aria-modal="true" onClick={onClose}><form className="card p-6 max-w-md w-full toast" onClick={e=>e.stopPropagation()} onSubmit={e=>{e.preventDefault();if(sel){onAssign(complaint.id,sel);onClose()}}}>
<div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg">Assign technician</h3><button type="button" aria-label="Close" onClick={onClose} className="p-1 text-slate-400 hover:text-slate-700"><Icon n="x" c="w-5 h-5"/></button></div>
<div className="bg-slate-50 rounded-xl p-3 text-sm mb-4"><p className="font-semibold">{complaint.id} · {complaint.category}</p><p className="text-slate-500">{complaint.building} – {complaint.room}</p><div className="mt-2"><Risk p={complaint.priority} s={complaint.riskScore}/></div></div>
<div className="space-y-2">{technicians.map(t=>{const off=t.availability==='Offline',v=pick(t);return <label key={t.id} className={cls('flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition',sel===v?'border-indigo-500 bg-indigo-50':'border-slate-200 hover:bg-slate-50',off&&'opacity-50 cursor-not-allowed')}><input type="radio" name="t" className="accent-indigo-600" disabled={off} checked={sel===v} onChange={()=>setSel(v)}/><div className="flex-1"><p className="text-sm font-semibold">{t.name}</p><p className="text-xs text-slate-500">{t.skill}</p></div><span className="text-[11px] font-semibold text-slate-500">{t.availability}</span></label>})}</div>
<div className="flex justify-end gap-2 mt-5"><Btn type="button" v="ghost" onClick={onClose}>Cancel</Btn><Btn type="submit" disabled={!sel}>Confirm assignment</Btn></div></form></div>;}

/* ============ COMPLAINT DRAWER ============ */
function Drawer({c,onClose,onAssign,onIncident}){if(!c)return null;
return <div className="fixed inset-0 z-[60]" role="dialog" aria-modal="true" aria-label="Complaint details"><div className="absolute inset-0 bg-slate-900/30" onClick={onClose}/><aside className="drawer absolute right-0 top-0 h-full w-full sm:w-[460px] bg-white shadow-2xl overflow-y-auto"><div className="sticky top-0 bg-white/95 backdrop-blur border-b border-slate-100 px-6 py-4 flex items-center justify-between z-10"><div><p className="mono text-xs text-slate-400">{c.id}</p><h2 className="font-bold text-lg">{c.category}</h2></div><button aria-label="Close drawer" onClick={onClose} className="p-2 rounded-lg hover:bg-slate-100"><Icon n="x" c="w-5 h-5"/></button></div>
<div className="p-6 space-y-5"><div className="flex flex-wrap gap-2"><Risk p={c.priority} s={c.riskScore}/><Pill s={c.status}/><AIBadge>{conf(c)}% confidence</AIBadge></div>
<p className="text-sm leading-relaxed text-slate-700">{c.description}</p>
{c.image&&<img src={c.image} alt="Evidence" className="rounded-2xl w-full h-44 object-cover border border-slate-200"/>}
<div className="grid grid-cols-2 gap-3 text-sm">{[['Location',`${c.building}, ${c.floor}`],['Room / Area',`${c.room} · ${c.area}`],['Reported',c.date],['Technician',c.assignedTechnician]].map(([k,v])=><div key={k} className="bg-slate-50 rounded-xl p-3"><p className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">{k}</p><p className="font-medium mt-0.5">{v}</p></div>)}</div>
<div className="rounded-2xl bg-ai-50 border border-ai-100 p-4"><div className="flex items-center justify-between mb-2"><p className="text-sm font-bold text-ai-700 flex items-center gap-1.5"><Icon n="sparkles" c="w-4 h-4"/>AI analysis</p></div><p className="text-sm text-slate-700">{c.aiExplanation}</p><ul className="mt-3 space-y-1">{c.hazards.map(h=><li key={h} className="text-sm flex items-center gap-2"><Icon n="triangle-alert" c="w-3.5 h-3.5 text-amber-500"/>{h}</li>)}</ul></div>
<div className="flex flex-wrap gap-2"><Btn onClick={()=>onAssign(c)}><Icon n="user-plus"/>Assign technician</Btn>{c.incidentId&&<Btn v="ghost" onClick={()=>{onClose();onIncident(c.incidentId)}}><Icon n="siren"/>View {c.incidentId}</Btn>}</div></div></aside></div>;}

/* ============ COMPLAINT TABLE ============ */
function ComplaintTable({complaints,q,setQ,onOpen,onAssign,compact}){
const[risk,setRisk]=useState('All'),[status,setStatus]=useState('All'),[cat,setCat]=useState('All'),[sort,setSort]=useState({k:'riskScore',d:-1}),[page,setPage]=useState(1),[load,setLoad]=useState(true),PS=compact?5:6;
useEffect(()=>{const t=setTimeout(()=>setLoad(false),650);return()=>clearTimeout(t)},[]);useEffect(()=>setPage(1),[q,risk,status,cat]);
const cats=useMemo(()=>['All',...new Set(complaints.map(c=>c.category))],[complaints]);
const rows=useMemo(()=>complaints.filter(c=>(risk==='All'||c.priority===risk)&&(status==='All'||c.status===status)&&(cat==='All'||c.category===cat)&&(!q||(c.id+c.category+c.description+c.room+c.building+c.assignedTechnician).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>{const x=sort.k==='conf'?conf(a)-conf(b):typeof a[sort.k]==='number'?a[sort.k]-b[sort.k]:String(a[sort.k]).localeCompare(String(b[sort.k]));return x*sort.d}),[complaints,q,risk,status,cat,sort]);
const pages=Math.max(1,Math.ceil(rows.length/PS)),vis=rows.slice((page-1)*PS,page*PS);
const grid='md:grid md:grid-cols-[84px_1.1fr_1.2fr_100px_104px_74px_1.1fr_100px_44px] md:gap-3 md:items-center';
const Th=({k,children})=><button onClick={()=>setSort(s=>({k,d:s.k===k?-s.d:-1}))} className="flex items-center gap-1 text-left hover:text-slate-800">{children}{sort.k===k&&<Icon n={sort.d<0?'arrow-down':'arrow-up'} c="w-3 h-3"/>}</button>;
const Sel=({v,set,opts,label})=><select aria-label={label} value={v} onChange={e=>set(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm">{opts.map(o=><option key={o} value={o}>{o==='All'?`${label}: All`:o}</option>)}</select>;
return <div className="card overflow-hidden"><div className="p-4 flex flex-wrap gap-2 items-center border-b border-slate-100"><div className="relative flex-1 min-w-[200px]"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon n="search"/></span><input aria-label="Search complaints" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search complaints, rooms, technicians…" className={inp+' pl-9'}/></div>
<Sel v={risk} set={setRisk} label="Risk" opts={['All','CRITICAL','HIGH','MEDIUM','LOW']}/><Sel v={status} set={setStatus} label="Status" opts={['All','Escalated','Investigating','Pending','Assigned','Resolved']}/><Sel v={cat} set={setCat} label="Category" opts={cats}/></div>
<div className={cls('hidden px-5 py-2.5 text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-slate-50/70',grid)}><span>ID</span><Th k="category">Category</Th><span>Location</span><Th k="riskScore">Risk</Th><Th k="status">Status</Th><Th k="conf">AI</Th><span>Technician</span><Th k="date">Time</Th><span/></div>
{load?<div className="p-5 space-y-3">{[...Array(4)].map((_,i)=><div key={i} className="skel h-12"/>)}</div>:vis.length===0?<Empty icon="inbox" title="No complaints match" text="Try adjusting your search or filters." action={<Btn v="ghost" className="mt-4" onClick={()=>{setQ('');setRisk('All');setStatus('All');setCat('All')}}>Clear filters</Btn>}/>:
<div className="divide-y divide-slate-100">{vis.map(c=><div key={c.id} onClick={()=>onOpen(c)} className={cls('px-5 py-3.5 cursor-pointer hover:bg-slate-50/80 transition flex flex-wrap gap-x-3 gap-y-1.5 items-center',grid)}>
<span className="mono text-xs text-slate-500 font-medium">{c.id}</span><span className="text-sm font-semibold">{c.category}</span><span className="text-sm text-slate-500 truncate">{c.building} · {c.room}</span><span><Risk p={c.priority} s={c.riskScore}/></span><span><Pill s={c.status}/></span><span className="text-xs font-semibold text-ai-700">{conf(c)}%</span><span className={cls('text-sm truncate',c.assignedTechnician==='Unassigned'?'text-slate-400 italic':'')}>{c.assignedTechnician}</span><span className="text-xs text-slate-400">{c.date}</span>
<span className="ml-auto md:ml-0"><Tip t="View details"><button aria-label={`View ${c.id}`} onClick={e=>{e.stopPropagation();onOpen(c)}} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><Icon n="panel-right-open"/></button></Tip></span></div>)}</div>}
<div className="px-5 py-3 flex items-center justify-between border-t border-slate-100 text-sm text-slate-500"><span>{rows.length} result{rows.length!==1&&'s'}</span><div className="flex items-center gap-2"><Btn v="ghost" className="!px-2.5 !py-1.5" disabled={page<=1} onClick={()=>setPage(p=>p-1)} aria-label="Previous page"><Icon n="chevron-left"/></Btn><span>Page {page} / {pages}</span><Btn v="ghost" className="!px-2.5 !py-1.5" disabled={page>=pages} onClick={()=>setPage(p=>p+1)} aria-label="Next page"><Icon n="chevron-right"/></Btn></div></div></div>;}

/* ============ DASHBOARD ============ */
function Dashboard({complaints,incidents,q,setQ,onOpen,onAssign,onIncident}){
const crit=complaints.filter(c=>c.priority==='CRITICAL').length,res=complaints.filter(c=>c.status==='Resolved').length,inc=incidents[0];

function Student({onSubmitSuccess,onIncident,toast}){

const n={id:`CMP-00${Math.floor(100+Math.random()*900)}`,category:f.category,description:f.description,building:f.building,floor:f.floor,room:f.room,area:f.area,image:f.imagePreview,date:'Just now',status:pr==='CRITICAL'?'Escalated':'Pending',priority:pr,riskScore:risk,hazards:el?['Proximity to live electricity','Corridor water accumulation']:['Minor convenience issue'],assignedTechnician:pr==='CRITICAL'?'Rajesh Kumar (Electrical)':'Unassigned',incidentId:pr==='CRITICAL'?'INC-001':null,aiExplanation:`Triage Agent flagged risk score ${risk}/100. Contextual analysis matched ${f.building} history.`};
setTimeout(()=>{setBusy(false);setRes(n);onSubmitSuccess(n)},500)}},550)};
const reset=()=>{setRes(null);setStep(1);setCur(-1);setF({category:'',description:'',building:'A Block',floor:'2nd Floor',room:'Room 204',area:'East Corridor',imagePreview:null})};
if(busy)return <div className="page max-w-xl mx-auto card p-8 mt-6 text-center"><div className="orb mx-auto w-20 h-20 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center text-white"><Icon n="sparkles" c="w-8 h-8"/></div><h2 className="text-xl font-bold mt-5">FixieWardie AI is analyzing your complaint</h2><p className="text-sm text-slate-500 mt-1">Agents are cross-referencing recent hostel incidents…</p>
<ul className="text-left mt-7 space-y-3">{PIPE.map((t,i)=>{const st=i<cur?'done':i===cur?'run':'wait';return <li key={t} className="flex items-center gap-3 text-sm transition-all"><span className="w-6 h-6 grid place-items-center">{st==='done'?<span className="w-6 h-6 rounded-full bg-emerald-500 text-white grid place-items-center"><Icon n="check" c="w-3.5 h-3.5"/></span>:st==='run'?<span className="w-5 h-5 rounded-full border-2 border-violet-600 border-t-transparent spin"/>:<span className="w-5 h-5 rounded-full border-2 border-slate-200"/>}</span><span className={st==='done'?'font-medium':st==='run'?'font-semibold text-violet-700':'text-slate-400'}>{t}</span></li>})}</ul><div className="h-1.5 bg-slate-100 rounded-full mt-7 overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all duration-500" style={{width:`${Math.min(100,cur/6*100)}%`}}/></div></div>;
if(res){const crit=res.priority==='CRITICAL';return <div className="page max-w-4xl mx-auto space-y-5"><div className="flex flex-wrap justify-between items-center gap-3"><div><AIBadge>Analysis complete</AIBadge><h1 className="text-2xl font-bold mt-2">AI Safety Assessment</h1><p className="text-sm text-slate-500">Complaint registered as <b className="mono">{res.id}</b> · {res.building}, {res.room}</p></div><Btn v="ghost" onClick={reset}>Submit another</Btn></div>
<div className="grid md:grid-cols-3 gap-5"><div className="card p-6 flex flex-col items-center gap-3"><Gauge v={res.riskScore}/><Risk p={res.priority}/><p className="text-xs text-slate-500">AI confidence <b className="text-ai-700">{conf(res)}%</b></p></div>

<div className="grid sm:grid-cols-2 gap-3 text-sm"><div className="bg-slate-50 rounded-xl p-3"><p className="text-[11px] uppercase font-semibold tracking-wider text-slate-400 mb-1.5">Detected hazards</p>{res.hazards.map(h=><p key={h} className="flex items-center gap-2"><Icon n="triangle-alert" c="w-3.5 h-3.5 text-amber-500"/>{h}</p>)}</div><div className="bg-slate-50 rounded-xl p-3"><p className="text-[11px] uppercase font-semibold tracking-wider text-slate-400 mb-1.5">Recommended action</p><p className="font-medium">{crit?'Dispatch Senior Electrical Specialist immediately.':'Add to routine maintenance queue.'}</p><p className="text-xs text-slate-500 mt-1">Technician: <b>{res.assignedTechnician}</b></p></div>
<div className="bg-slate-50 rounded-xl p-3"><p className="text-[11px] uppercase font-semibold tracking-wider text-slate-400 mb-1.5">Incident correlation</p>{crit?<p className="font-medium">Linked to <button className="text-indigo-600 underline" onClick={()=>onIncident('INC-001')}>INC-001</button> · 3 similar complaints</p>:<p className="text-slate-500">No related incidents found.</p>}</div><div className="bg-slate-50 rounded-xl p-3"><p className="text-[11px] uppercase font-semibold tracking-wider text-slate-400 mb-1.5">Response priority</p><p className="font-medium">{crit?'P0 — respond within 15 minutes':'P3 — within 48 hours'}</p></div></div></div></div>
<div className="card p-6"><h3 className="font-bold mb-5">Recommended next steps</h3><Timeline items={[{title:'Complaint submitted',time:'Just now',icon:'file-text'},{title:'Risk detection',tag:`Score ${res.riskScore}`,icon:'gauge'},{title:'Incident correlation',text:crit?'Merged into INC-001':'No correlation',icon:'git-merge'},{title:'Technician dispatch',text:res.assignedTechnician,icon:'truck',done:crit},{title:'Resolution',text:'Awaiting completion',icon:'circle-check',done:false}]}/></div></div>;}
return <div className="page max-w-3xl mx-auto"><Head title="Student Portal" sub="Report a hostel issue — FixieWardie AI triages it in seconds."/>
<div className="flex items-center gap-2 mb-5 overflow-x-auto">{labels.map((l,i)=><div key={l} className="flex items-center gap-2"><span className={cls('flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap',step===i+1?'bg-indigo-600 text-white':step>i+1?'bg-emerald-50 text-emerald-700':'bg-white border border-slate-200 text-slate-400')}>{step>i+1?<Icon n="check" c="w-3 h-3"/>:i+1}{l}</span>{i<4&&<span className="w-4 h-px bg-slate-300"/>}</div>)}</div>
<div className="card p-6 md:p-7" key={step}>
{step===1&&<div className="page"><h2 className="font-bold text-lg mb-4">What type of issue is it?</h2><div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{CATS.map(([n,i,s])=><button key={n} onClick={()=>set({category:n})} aria-pressed={f.category===n} className={cls('hov text-left p-4 rounded-2xl border-2 transition',f.category===n?'border-indigo-500 bg-indigo-50':'border-slate-200 bg-white')}><span className={cls('w-10 h-10 rounded-xl grid place-items-center mb-3',f.category===n?'bg-indigo-600 text-white':'bg-slate-100 text-slate-500')}><Icon n={i} c="w-5 h-5"/></span><p className="font-semibold text-sm">{n.replace(' Problem','')}</p><p className="text-xs text-slate-500">{s}</p></button>)}</div></div>}
{step===2&&<div className="page"><h2 className="font-bold text-lg mb-1">Describe the issue</h2><p className="text-sm text-slate-500 mb-3">Write naturally — AI will extract the hazards.</p><textarea aria-label="Problem description" rows={6} value={f.description} onChange={e=>set({description:e.target.value})} className={inp} placeholder="e.g. Water is leaking right next to the switchboard and I heard a buzzing sound…"/><p className="text-xs text-ai-700 mt-2 flex items-center gap-1.5"><Icon n="sparkles" c="w-3.5 h-3.5"/>Tip: mention what, where and how long — it improves risk accuracy.</p></div>}
{step===3&&<div className="page"><h2 className="font-bold text-lg mb-4">Where is it?</h2><div className="grid sm:grid-cols-2 gap-4">{[['Building / Wing','building',['A Block','B Block','C Block','D Block']],['Floor','floor'],['Room number','room'],['Corridor / common area','area']].map(([l,k,o])=><label key={k} className="text-sm font-medium">{l}{o?<select value={f[k]} onChange={e=>set({[k]:e.target.value})} className={inp+' mt-1.5'}>{o.map(x=><option key={x}>{x}</option>)}</select>:<input value={f[k]} onChange={e=>set({[k]:e.target.value})} className={inp+' mt-1.5'}/>}</label>)}</div></div>}
{step===4&&<div className="page"><h2 className="font-bold text-lg mb-1">Add photo evidence</h2><p className="text-sm text-slate-500 mb-3">Optional, but helps AI inspect the hazard.</p>{!f.imagePreview?<label onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);readFile(e.dataTransfer.files[0])}} className={cls('block border-2 border-dashed rounded-2xl p-10 text-center cursor-pointer transition',drag?'border-indigo-500 bg-indigo-50':'border-slate-300 hover:bg-slate-50')}><input type="file" accept="image/png,image/jpeg" className="sr-only" onChange={e=>readFile(e.target.files[0])}/><span className="mx-auto w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 grid place-items-center mb-3"><Icon n="cloud-upload" c="w-6 h-6"/></span><p className="font-semibold text-sm">Drag & drop or click to upload</p><p className="text-xs text-slate-400 mt-1">PNG or JPG</p></label>:<div className="relative max-w-sm"><img src={f.imagePreview} alt="Upload preview" className="rounded-2xl h-48 w-full object-cover border border-slate-200"/><button aria-label="Remove photo" onClick={()=>set({imagePreview:null})} className="absolute top-2 right-2 p-1.5 bg-slate-900/80 text-white rounded-full"><Icon n="x"/></button></div>}</div>}

function Incident({incident,complaints,onBack,toast,confirm,onOpen}){

const s=incident.timeline.map(t=>t.s),W=300,H=90,pts=s.map((v,i)=>`${10+i*(W-20)/(s.length-1)},${H-10-(v/100)*(H-20)}`).join(' ');
const rel=complaints.filter(c=>c.incidentId===incident.id);
return <div className="page space-y-5"><button onClick={onBack} className="text-sm text-slate-500 hover:text-slate-800 flex items-center gap-1"><Icon n="arrow-left"/>Back to dashboard</button>
<div className="card p-6"><div className="flex flex-wrap justify-between gap-4"><div><div className="flex flex-wrap gap-2 items-center"><span className="mono text-xs bg-slate-100 px-2 py-0.5 rounded">{incident.id}</span><Risk p={incident.priority}/><span className="text-[11px] font-bold text-red-700">{incident.status}</span></div><h1 className="text-2xl font-bold mt-2">{incident.title}</h1><p className="text-sm text-slate-500 mt-1 flex items-center gap-1.5"><Icon n="map-pin"/>{incident.location} · Created Thu 07:20</p></div><div className="text-right"><p className="text-xs text-slate-400">Risk score</p><p className="text-5xl font-extrabold text-red-600">{incident.riskScore}</p></div></div>
<div className="mt-5 rounded-2xl bg-ai-50 border border-ai-100 p-4"><div className="flex items-center gap-2 mb-1"><b className="text-sm text-ai-700 flex items-center gap-1.5"><Icon n="sparkles"/>AI summary & recommendation</b><AIBadge>Action Planner Agent</AIBadge></div><p className="text-sm text-slate-700">{incident.recommendedAction}</p><p className="text-xs text-ai-700 mt-1.5">Recommended specialist: <b>{incident.recommendedTechnician}</b></p></div></div>
<div className="grid lg:grid-cols-5 gap-5"><div className="card p-6 lg:col-span-3"><h3 className="font-bold mb-5">Incident timeline</h3><Timeline items={incident.timeline.map((t,i)=>({title:t.text,time:t.time,tag:t.risk,icon:i===incident.timeline.length-1?'git-merge':'circle-alert',color:t.s>=95?'bg-red-500':t.s>=75?'bg-amber-500':'bg-indigo-600'})).concat([{title:'Technician assigned · resolution pending',icon:'wrench',done:false}])}/></div>
<div className="lg:col-span-2 space-y-5"><div className="card p-6"><h3 className="font-bold mb-3">Risk progression</h3><svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="Risk score over time"><polyline points={pts} fill="none" stroke="#ef4444" strokeWidth="2.5" strokeLinejoin="round"/>{s.map((v,i)=><circle key={i} cx={10+i*(W-20)/(s.length-1)} cy={H-10-(v/100)*(H-20)} r="3.5" fill="#fff" stroke="#ef4444" strokeWidth="2"/>)}</svg><div className="flex justify-between text-[11px] text-slate-400 mt-1"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Now</span></div></div>

function Agents(){const flow=['Complaint','Triage Agent','Risk Assessment','Incident Correlation','Action Planner','Technician Dispatch','Notification'];
return <div className="page space-y-6"><Head title="AI Agents" sub="Multi-agent orchestration pipeline powering every complaint." right={<AIBadge>5 agents healthy</AIBadge>}/>
<div className="card p-6"><h3 className="font-bold mb-4">Orchestration flow</h3><div className="flex flex-col lg:flex-row lg:items-center gap-2 lg:overflow-x-auto">{flow.map((n,i)=><React.Fragment key={n}><div className={cls('px-4 py-2.5 rounded-xl text-sm font-semibold text-center whitespace-nowrap border',i===0||i===5?'bg-slate-50 border-slate-200':i===6?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-ai-50 border-ai-100 text-ai-700')}>{n}</div>{i<6&&<span className="text-slate-300 self-center"><Icon n="arrow-right" c="w-4 h-4 rotate-90 lg:rotate-0"/></span>}</React.Fragment>)}</div></div>
<div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">{AGENTS.map(a=><div key={a.n} className="card hov p-5"><div className="flex justify-between"><span className="w-11 h-11 rounded-2xl bg-ai-50 text-ai-600 grid place-items-center"><Icon n={a.i} c="w-5 h-5"/></span><span className="flex items-center gap-1.5 text-xs font-semibold text-emerald-700"><span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"/>Active</span></div><h3 className="font-bold mt-3">{a.n}</h3><p className="text-sm text-slate-500 mt-1">{a.p}</p><div className="flex justify-between mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500"><span>Last activity <b className="text-slate-800">{a.a}</b></span><span>Tasks <b className="text-slate-800">{a.t.toLocaleString()}</b></span></div></div>)}</div></div>;}

/* ============ API ARCHITECTURE ============ */
function Arch(){const L=['Frontend','API Gateway','AI Engine','Risk Detection','Incident Correlation','Database','Notification Service'],M={POST:'text-indigo-600 bg-indigo-50',GET:'text-emerald-600 bg-emerald-50'};
const E=[['POST','/api/v1/complaints','Submits natural-language complaint + photo. Triggers the agentic AI pipeline.'],['GET','/api/v1/complaints','Fetches all active complaints sorted by dynamic AI risk score.'],['GET','/api/v1/incidents/INC-001','Retrieves correlated incident details and multi-day hazard timeline.'],['POST','/api/v1/complaints/{id}/assign','Assigns technician and updates status in real time.']];
return <div className="page max-w-4xl space-y-6"><Head title="API Architecture" sub="Frontend is ready to connect to a Python/FastAPI backend — swap App state handlers for these calls."/>
<div className="card p-6"><h3 className="font-bold mb-4">System architecture</h3><div className="flex flex-col items-stretch gap-1">{L.map((n,i)=><React.Fragment key={n}><div className="mono text-sm px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 flex justify-between"><span>{n}</span><span className="text-slate-400 text-xs">{String(i+1).padStart(2,'0')}</span></div>{i<6&&<div className="text-center text-slate-300 leading-none"><Icon n="arrow-down"/></div>}</React.Fragment>)}</div></div>
<div className="grid sm:grid-cols-2 gap-4">{E.map(([m,p,d])=><div key={m+p} className="card hov p-4"><div className="flex items-center gap-2 flex-wrap"><span className={`mono text-[11px] font-bold px-2 py-0.5 rounded ${M[m]}`}>{m}</span><code className="mono text-xs break-all">{p}</code></div><p className="text-sm text-slate-500 mt-2">{d}</p></div>)}</div></div>;}

/* ============ APP SHELL ============ */
const NAV=[['OVERVIEW',[['dashboard','Dashboard','layout-dashboard'],['student','Student Portal','circle-plus']]],['OPERATIONS',[['complaints','Complaints','clipboard-list'],['incidents','Incidents','siren'],['technicians','Technicians','wrench'],['agents','AI Agents','bot']]],['SYSTEM',[['architecture','API Architecture','code-xml'],['settings','Settings','settings']]]];
const TITLES=Object.fromEntries(NAV.flatMap(([,a])=>a.map(([k,t])=>[k,t])));
function App(){
const[route,setRoute]=useState('dashboard'),[complaints,setComplaints]=useState(INITIAL_COMPLAINTS),[incidents,setIncidents]=useState(INITIAL_INCIDENTS),[technicians,setTechs]=useState(INITIAL_TECHNICIANS),[selInc,setSelInc]=useState('INC-001'),[drawer,setDrawer]=useState(null),[assign,setAssign]=useState(null),[nav,setNav]=useState(false),[q,setQ]=useState(''),[toasts,setToasts]=useState([]),[conf_,setConf]=useState(null),[notif,setNotif]=useState(true),[notifOpen,setNotifOpen]=useState(false);
const toast=(m,t='info')=>{const id=Math.random();setToasts(p=>[...p,{id,m,t}]);setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),3200)};
const go=r=>{setRoute(r);setNav(false);window.scrollTo({top:0})};
const addComplaint=n=>{setComplaints(p=>[n,...p]);if(n.incidentId)setIncidents(p=>p.map(i=>i.id===n.incidentId?{...i,relatedComplaints:[...i.relatedComplaints,n.id],timeline:[...i.timeline,{time:'Just now',text:`New complaint ${n.id} correlated into ${i.id} by AI`,risk:`Critical (${n.riskScore})`,s:n.riskScore}]}:i));toast(`${n.id} analyzed · ${n.priority} priority`,n.priority==='CRITICAL'?'error':'success')};
const doAssign=(id,name)=>{setComplaints(p=>p.map(c=>c.id===id?{...c,assignedTechnician:name,status:'Assigned'}:c));setDrawer(d=>d&&d.id===id?{...d,assignedTechnician:name,status:'Assigned'}:d);toast(`${id} assigned to ${name}`,'success')};
const viewInc=id=>{setSelInc(id);setDrawer(null);go('incident')};
const sc=route==='incident'?'incidents':route;
useEffect(()=>{const k=e=>{if(e.key==='Escape'){setDrawer(null);setNav(false);setNotifOpen(false)}};window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k)},[]);
const Side=<div className="h-full flex flex-col bg-white border-r border-slate-200"><div className="px-5 h-16 flex items-center gap-3 border-b border-slate-100"><span className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white grid place-items-center"><Icon n="shield-check" c="w-5 h-5"/></span><div><p className="font-bold leading-tight">FixieWardie <span className="text-ai-600">AI</span></p><p className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Safety Operations</p></div></div>
<nav className="flex-1 overflow-y-auto px-3 py-4 space-y-5" aria-label="Main">{NAV.map(([sec,items])=><div key={sec}><p className="px-3 mb-1.5 text-[10px] font-bold tracking-widest text-slate-400">{sec}</p>{items.map(([k,l,i])=>{const on=sc===k||(k==='complaints'&&false);return <button key={k} onClick={()=>k==='incidents'?viewInc('INC-001'):go(k)} aria-current={on?'page':undefined} className={cls('w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium transition-all',on?'bg-indigo-50 text-indigo-700':'text-slate-600 hover:bg-slate-100 hover:text-slate-900')}><Icon n={i}/>{l}{k==='incidents'&&<span className="ml-auto text-[10px] font-bold bg-red-100 text-red-700 rounded-full px-1.5">{incidents.length}</span>}</button>})}</div>)}</nav>
<div className="p-3 border-t border-slate-100 space-y-2"><div className="flex items-center gap-2 px-3 py-2 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-semibold"><span className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"/>AI engine operational</div><div className="flex items-center gap-3 px-2 py-1.5"><span className="w-9 h-9 rounded-full bg-indigo-600 text-white text-sm font-bold grid place-items-center">DW</span><div className="leading-tight"><p className="text-sm font-semibold">Dr. Warden</p><p className="text-xs text-slate-400">Hostel Warden</p></div></div></div></div>;
return <div className="min-h-screen lg:pl-64">
<aside className="hidden lg:block fixed inset-y-0 left-0 w-64 z-30">{Side}</aside>
{nav&&<div className="lg:hidden fixed inset-0 z-50"><div className="absolute inset-0 bg-slate-900/40" onClick={()=>setNav(false)}/><div className="mdrawer absolute left-0 inset-y-0 w-72">{Side}</div></div>}
<header className="sticky top-0 z-20 h-16 bg-white/90 backdrop-blur border-b border-slate-200 px-4 md:px-8 flex items-center gap-3"><button className="lg:hidden p-2 -ml-2 rounded-lg hover:bg-slate-100" aria-label="Open menu" onClick={()=>setNav(true)}><Icon n="menu" c="w-5 h-5"/></button>
<div className="hidden sm:block leading-tight min-w-0"><p className="text-xs text-slate-400">FixieWardie / {TITLES[sc]||'Incident'}</p><p className="font-bold truncate">{route==='dashboard'?'Warden Command Center':route==='incident'?'Incident Details':TITLES[route]}</p></div>
<div className="relative flex-1 max-w-md ml-auto"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon n="search"/></span><input aria-label="Global search" value={q} onChange={e=>{setQ(e.target.value);if(e.target.value&&route!=='dashboard'&&route!=='complaints')go('complaints')}} placeholder="Search complaints…" className={inp+' pl-9 !py-2 bg-slate-50'}/></div>
<span className="hidden md:flex"><AIBadge>AI online</AIBadge></span>
<div className="relative"><Tip t="Notifications"><button aria-label="Notifications" onClick={()=>{setNotifOpen(o=>!o);setNotif(false)}} className="relative p-2 rounded-xl hover:bg-slate-100"><Icon n="bell" c="w-5 h-5"/>{notif&&<span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"/>}</button></Tip>
{notifOpen&&<div className="toast absolute right-0 mt-2 w-72 card p-2 z-40">{[['Critical incident INC-001 escalated','Thu 07:20'],['CMP-003 correlated by AI','Thu 07:20']].map(([t,s])=><button key={t} onClick={()=>{setNotifOpen(false);viewInc('INC-001')}} className="w-full text-left p-3 rounded-xl hover:bg-slate-50"><p className="text-sm font-medium">{t}</p><p className="text-xs text-slate-400">{s}</p></button>)}</div>}</div>
<span className="w-9 h-9 rounded-full bg-indigo-600 text-white text-sm font-bold grid place-items-center">DW</span></header>
<main className="p-4 md:p-8 max-w-[1400px] mx-auto" key={route}>
{route==='dashboard'&&<Dashboard complaints={complaints} incidents={incidents} q={q} setQ={setQ} onOpen={setDrawer} onAssign={setAssign} onIncident={viewInc}/>}
{route==='complaints'&&<div className="page"><Head title="Complaints" sub="All hostel complaints triaged by FixieWardie AI."/><ComplaintTable complaints={complaints} q={q} setQ={setQ} onOpen={setDrawer} onAssign={setAssign}/></div>}
{route==='student'&&<Student onSubmitSuccess={addComplaint} onIncident={viewInc} toast={toast}/>}
{route==='incident'&&<Incident incident={incidents.find(i=>i.id===selInc)} complaints={complaints} onBack={()=>go('dashboard')} toast={toast} confirm={setConf} onOpen={setDrawer}/>}
{route==='technicians'&&<Techs technicians={technicians} complaints={complaints} onAssign={setAssign}/>}
{route==='agents'&&<Agents/>}
{route==='architecture'&&<Arch/>}
{route==='settings'&&<div className="page"><Head title="Settings"/><div className="card"><Empty icon="settings" title="Workspace settings" text="Notification rules, escalation thresholds and integrations will appear here." action={<Btn v="ghost" className="mt-4" onClick={()=>toast('Settings are not available in this demo','info')}>Learn more</Btn>}/></div></div>}
</main>
<Drawer c={drawer} onClose={()=>setDrawer(null)} onAssign={setAssign} onIncident={viewInc}/>
<AssignModal complaint={assign} technicians={technicians} onClose={()=>setAssign(null)} onAssign={doAssign}/>
<Confirm d={conf_} onClose={()=>setConf(null)}/>
<div className="fixed bottom-4 right-4 z-[80] space-y-2" aria-live="polite">{toasts.map(t=><div key={t.id} className="toast card px-4 py-3 text-sm font-medium flex items-center gap-2.5"><span className={t.t==='success'?'text-emerald-600':t.t==='error'?'text-red-600':'text-indigo-600'}><Icon n={t.t==='success'?'circle-check':t.t==='error'?'triangle-alert':'info'} c="w-4 h-4"/></span>{t.m}</div>)}</div></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
